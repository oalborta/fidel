<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Tarjeta Digital</title>
  
  <!-- Configuración para PWA limpia en pantalla completa -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe id="app-frame" src="" allow="clipboard-write"></iframe>

  <script>
    // URL base de tu Google Apps Script (/exec)
    const APPS_SCRIPT_BASE_URL = "PEGA_AQUI_TU_URL_EXEC";

    // Captura los parámetros que vengan en GitHub (?biz=...&cli=...)
    const currentParams = window.location.search;

    // Concatena y carga la tarjeta limpia dentro del marco
    const targetUrl = APPS_SCRIPT_BASE_URL + currentParams;
    document.getElementById('app-frame').src = targetUrl;
  </script>

</body>
</html>
