<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pwa-title">Mi Tarjeta Digital</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <link id="dynamic-favicon" rel="icon" type="image/png" href="">
  <link id="dynamic-apple-icon" rel="apple-touch-icon" href="">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <iframe id="app-frame" src="" allow="clipboard-write"></iframe>

  <script>
    // 1. Pega aquí tu URL /exec de Google Apps Script
    const APPS_SCRIPT_BASE_URL = "https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbzv35IzsSI86saKvk0F-1k1BV6XtLOGtL-dlpUmjwdBTPJhdyFvu39WvI7-g-T-t6u-/exec";

    // 2. Diccionario de marcas e imágenes de sellos
    const BRAND_ICONS = {
      "MACCHIA": "https://lh3.googleusercontent.com/d/1WzFb7rEBFlYu3sQGGo2o_yRq5u8lcNbG",
      "ANDALE": "https://lh3.googleusercontent.com/d/1GICfcXVVYJUcIdmXHmYmB6XFHsvvSK74"
    };

    // 3. Capturar parámetros
    const urlParams = new URLSearchParams(window.location.search);
    const biz = (urlParams.get('biz') || 'MACCHIA').toUpperCase();

    // 4. Asignar ícono según negocio
    const iconUrl = BRAND_ICONS[biz] || "";
    if (iconUrl) {
      document.getElementById('dynamic-favicon').href = iconUrl;
      document.getElementById('dynamic-apple-icon').href = iconUrl;
    }
    if (biz) {
      document.getElementById('pwa-title').innerText = "Club " + biz;
    }

    // 5. Cargar la tarjeta en el iframe
    const currentParams = window.location.search;
    document.getElementById('app-frame').src = APPS_SCRIPT_BASE_URL + currentParams;
  </script>

</body>
</html>
